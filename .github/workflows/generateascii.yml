name: ASCII workflow
on: push

jobs:
    build_job:
      runs-on: ubuntu-latest
      steps:
          - name: Build Application
            run : sudo apt-get install cowsay -y

          - name: Execute CosWay CMD
            run : cowsay -f dragon "Generating a Dragon using Cosway..." >> dragon.txt

          - name: Upload Dragon text
            uses: actions/upload-artifact@v4
            with:
              name: dragon-text-file
              path: dragon.txt

    test_job:
      needs: build_job
      runs-on: ubuntu-latest
      steps:
        - name: sleep for 10 seconds
          run : sleep 10
        
        - name: download Dragon artifact
          uses: actions/download-artifact@v4
          with:
            name: dragon-text-file

        - name: Test file Exist
          run : grep -i "dragon" dragon.txt


    deploy_job:
      needs: test_job
      runs-on: ubuntu-latest
      steps:
        - name: download Dragon artifact
          uses: actions/download-artifact@v4
          with:
            name: dragon-text-file

        - name: Read File
          run : cat dragon.txt
        
        - name: Deploy
          run : echo Deploying...

              
            

