name: ASCII workflow
on: push

jobs:
    build_job:
      runs-on: ubuntu-latest
      steps:
          - name: Build Application
            run : sudo apt-install cowsay -y

          - name: Execute CosWay CMD
            run : cowsay -f dragon "Generating a Dragon using Cosway..." >> dragon.txt

          - name: Sleep for 5 Seconds
            run : sleep 5



    test_job:
      runs-on: ubuntu-latest
      steps:
        - name: sleep for 10 seconds
          run : sleep 10

        - name: Test file Exist
          run : grip -i "dragon" dragon.txt


    deploy_job:
      runs-on: ubuntu-latest
      steps:
        - name: Read File
          run : cat dragon.txt
        
        - name: Deploy
          run : echo Deploying...

              
            

